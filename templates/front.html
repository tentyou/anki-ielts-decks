<main id="FrontSide" class="CardSide front">
  <div class="card-meta" data-module="frequency">{{Group}}</div>
  <header class="word-header">
    <h1 lang="en">{{Word}}</h1>
    <div class="word-audio" data-module="wordAudio">
      <span class="accent-audio" data-module="britishAudio"><span class="accent-label">英音</span>{{WordAudioUK}}</span>
      <span class="accent-audio" data-module="americanAudio"><span class="accent-label">美音</span>{{WordAudio}}</span>
    </div>
  </header>
  <p class="recall-prompt">回忆中文释义，然后翻面。</p>
  <nav class="card-sources" data-module="sources"><a href="{{CambridgeURL}}">Cambridge</a></nav>
  <div class="deck-updates" data-module="updateCheck">
    <span class="deck-version">v__DECK_VERSION__</span>
    <button type="button" class="check-update">检查更新</button>
    <a class="release-link" href="https://github.com/tentyou/anki-ielts-decks/releases/latest">版本与下载</a>
    <span class="update-status" role="status" aria-live="polite"></span>
  </div>
</main>
<!-- MODULE_SETTINGS -->
